# PostgreSQL for Robot Repair (vision Section 8).
#   docker compose up -d
#   set DATABASE_URL=postgresql+psycopg://robot:robot@localhost:5432/robot_repair
#   uvicorn main:app --reload --app-dir web/backend
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: robot
      POSTGRES_PASSWORD: robot   # local development only
      POSTGRES_DB: robot_repair
    ports:
      - "5432:5432"
    volumes:
      - robot_repair_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U robot -d robot_repair"]
      interval: 5s
      retries: 10

volumes:
  robot_repair_data:
