<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C2740"/>
      <stop offset="1" stop-color="#0B1020"/>
    </linearGradient>
    <radialGradient id="helmet" cx=".32" cy=".25" r=".85">
      <stop offset="0" stop-color="#F2EDE6"/>
      <stop offset=".45" stop-color="#9A948C"/>
      <stop offset="1" stop-color="#3A3633"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9C9488"/>
      <stop offset="1" stop-color="#2A2724"/>
    </linearGradient>
    <radialGradient id="lens" cx=".38" cy=".36" r=".7">
      <stop offset="0" stop-color="#F4FFFF"/>
      <stop offset=".35" stop-color="#8BF1FF"/>
      <stop offset=".7" stop-color="#36D9F5"/>
      <stop offset="1" stop-color="#0B5E73"/>
    </radialGradient>
  </defs>
  <!-- tile -->
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="14" fill="none" stroke="#36D9F5" stroke-opacity=".35" stroke-width="2"/>
  <!-- ear lights -->
  <circle cx="11" cy="33" r="6" fill="url(#rim)" stroke="#141210" stroke-width="1.5"/>
  <circle cx="11" cy="33" r="2.6" fill="#36D9F5"/>
  <circle cx="53" cy="33" r="6" fill="url(#rim)" stroke="#141210" stroke-width="1.5"/>
  <circle cx="53" cy="33" r="2.6" fill="#36D9F5"/>
  <!-- helmet -->
  <circle cx="32" cy="30" r="21" fill="url(#helmet)" stroke="#141210" stroke-width="2"/>
  <path d="M32 9 V22" stroke="#2A2724" stroke-width="2"/>
  <ellipse cx="23" cy="17" rx="6" ry="3" fill="#FFFFFF" opacity=".5" transform="rotate(-28 23 17)"/>
  <!-- faceplate and grille -->
  <path d="M17 37 Q18 52 32 53 Q46 52 47 37 Z" fill="#3A3633" stroke="#141210" stroke-width="1.5"/>
  <path d="M27 44 V50 M30.3 44 V50 M33.7 44 V50 M37 44 V50" stroke="#141210" stroke-width="1.8" stroke-linecap="round"/>
  <!-- strap and goggles -->
  <rect x="10" y="30" width="44" height="6" rx="2.5" fill="#2A2420"/>
  <circle cx="24" cy="33" r="9" fill="url(#rim)" stroke="#0E0C0A" stroke-width="1"/>
  <circle cx="40" cy="33" r="9" fill="url(#rim)" stroke="#0E0C0A" stroke-width="1"/>
  <circle cx="24" cy="33" r="6.5" fill="url(#lens)"/>
  <circle cx="40" cy="33" r="6.5" fill="url(#lens)"/>
  <circle cx="22" cy="31" r="1.6" fill="#FFFFFF"/>
  <circle cx="38" cy="31" r="1.6" fill="#FFFFFF"/>
  <!-- repair spark -->
  <path d="M54 8 L55.8 13 L61 14.8 L55.8 16.6 L54 22 L52.2 16.6 L47 14.8 L52.2 13 Z" fill="#FFCA70" stroke="#0B1020" stroke-width="1.4" stroke-linejoin="round"/>
</svg>
