<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C2740"/>
      <stop offset="1" stop-color="#0B1020"/>
    </linearGradient>
    <linearGradient id="dome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C4BEF0"/>
      <stop offset="1" stop-color="#5A5585"/>
    </linearGradient>
    <radialGradient id="lens" cx=".38" cy=".38" r=".7">
      <stop offset="0" stop-color="#F0FEFF"/>
      <stop offset=".45" stop-color="#36D9F5"/>
      <stop offset="1" stop-color="#0F6E86"/>
    </radialGradient>
  </defs>
  <!-- tile -->
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="14" fill="none" stroke="#36D9F5" stroke-opacity=".35" stroke-width="2"/>
  <!-- antennas -->
  <path d="M25 16 L20 8 M39 16 L44 8" stroke="#A49FD0" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="20" cy="8" r="3" fill="#FFCA70"/>
  <circle cx="44" cy="8" r="3" fill="#36D9F5"/>
  <!-- dome head -->
  <path d="M8 40 C8 22 19 13 32 13 C45 13 56 22 56 40 C56 49 49 55 40 55 L24 55 C15 55 8 49 8 40 Z" fill="url(#dome)" stroke="#2A2547" stroke-width="2.5"/>
  <path d="M13 28 C17 20 24 16 32 16" fill="none" stroke="#F0FEFF" stroke-opacity=".5" stroke-width="2.5" stroke-linecap="round"/>
  <!-- goggles -->
  <rect x="26" y="36" width="12" height="5" fill="#1B1F33"/>
  <circle cx="21.5" cy="39" r="11" fill="#1B1F33"/>
  <circle cx="42.5" cy="39" r="11" fill="#1B1F33"/>
  <circle cx="21.5" cy="39" r="7.5" fill="url(#lens)"/>
  <circle cx="42.5" cy="39" r="7.5" fill="url(#lens)"/>
  <circle cx="19" cy="36.5" r="2.2" fill="#FFFFFF" opacity=".9"/>
  <circle cx="40" cy="36.5" r="2.2" fill="#FFFFFF" opacity=".9"/>
  <!-- repair spark -->
  <path d="M54 13 L56 18.5 L61.5 20.5 L56 22.5 L54 28 L52 22.5 L46.5 20.5 L52 18.5 Z" fill="#FFCA70" stroke="#0B1020" stroke-width="1.5" stroke-linejoin="round"/>
